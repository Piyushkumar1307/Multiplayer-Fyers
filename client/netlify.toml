# Legacy: player-only deploy (base directory = client).
# For player + admin on one site, use /netlify.toml at repo root instead.

[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
